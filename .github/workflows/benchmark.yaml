name: '⏱️ Benchmark'

on:
  workflow_dispatch: null
  pull_request: null
  push:
    branches:
      - 'main'

# Permissions are overridden at the job level.
permissions: {}

# Group run concurrency by workflow and branch.
# PR branch updates cancel and replace any existing run.
# Updates to the 'main' branch cause runs to queue.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'main'  }}

env:
  PYTHON_VERSION: '3.14'
  UV_VERSION: '0.13.5'

jobs:
  benchmark:
    # Never run in forks.
    if: "${{ github.repository == 'jsonpath-ng/jsonpath-ng' }}"

    runs-on: 'ubuntu-24.04'

    permissions:
      contents: 'read' # Required for actions/checkout
      id-token: 'write' # Required for OIDC authentication with CodSpeed

    steps:
      - name: 'Checkout repo'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: 'false'

      - name: 'Setup Python'
        uses: 'actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0' # v7.1.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: 'Setup uv'
        uses: 'astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e' # v10.3.2
        with:
          version: "${{ env.UV_VERSION }}"

      - name: 'Run benchmarks'
        uses: 'CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062' # v5.6.0
        with:
          mode: 'simulation'
          run: 'uv run --with pytest-codspeed pytest --codspeed'
