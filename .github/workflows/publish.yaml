name: '📦 Publish'

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Permissions are overwritten in each job.
permissions: {}

env:
  PYTHON_VERSION: '3.14'
  UV_VERSION: '0.13.5'
  BUILD_VERSION: '1.6.1'
  SETUPTOOLS_VERSION: '84.0.0'

jobs:
  build:
    name: 'Build'
    # Never run in forks.
    if: "${{ github.repository == 'jsonpath-ng/jsonpath-ng' }}"

    runs-on: 'ubuntu-24.04'

    permissions:
      contents: 'read'

    outputs:
      artifact-id: "${{ steps.upload-artifact.outputs.artifact-id }}"

    steps:
      - name: 'Checkout repo'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: 'false'

      - name: 'Setup Python'
        uses: 'actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0' # v7.1.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: 'Setup uv'
        uses: 'astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e' # v10.3.2
        with:
          enable-cache: 'false'
          version: "${{ env.UV_VERSION }}"

      - name: 'Validate tag name'
        shell: 'python'
        run: |
          import os
          import pathlib
          import tomllib

          pyproject = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          if f"v{pyproject['project']['version']}" != os.environ["GITHUB_REF_NAME"]:
              raise SystemExit("The project version and git tag do not match!")

      - name: 'Build packages'
        run: |
          uv run --no-project \
            --with "build==${{ env.BUILD_VERSION }}" \
            --with "setuptools==${{ env.SETUPTOOLS_VERSION }}" \
            -m build --no-isolation -o dist/

      - name: 'Upload artifact'
        id: 'upload-artifact'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
        with:
          name: "packages-${{ github.run_id }}-${{ github.run_attempt }}"
          path: 'dist/'
          if-no-files-found: 'error'
          retention-days: '1'
          overwrite: 'false'

  publish:
    needs:
      - 'build'

    name: 'Publish'
    environment: 'PyPI'
    runs-on: 'ubuntu-24.04'

    permissions:
      id-token: 'write' # Required for Trusted Publishing

    steps:
      - name: 'Download artifact'
        uses: 'actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333' # v8.0.2
        with:
          artifact-ids: "${{ needs.build.outputs.artifact-id }}"
          path: 'dist/'

      - name: 'Publish to PyPI'
        uses: 'pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086' # v1.14.3
